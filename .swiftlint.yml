included:
  - Sources

excluded:
  - Sources/TestRunner
  - .build

# ── Disabled rules ────────────────────────────────────────────────────────────
disabled_rules:
  - todo                        # TODOs tracked externally
  - file_header                 # no file headers per project conventions
  - missing_docs                # no doc-comment requirement per project conventions
  - explicit_type_interface     # too noisy with Swift type inference
  - multiline_arguments         # conflicts with SwiftUI call-site style
  - multiline_parameters        # same
  - vertical_whitespace_between_cases
  - no_grouping_extension       # extensions for protocol conformance are fine

# ── Opt-in rules ──────────────────────────────────────────────────────────────
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping            # warn on !, document why when used
  - overridden_super_call
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unused_import

# ── Thresholds ────────────────────────────────────────────────────────────────
line_length:
  warning: 130
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 600

cyclomatic_complexity:
  warning: 12
  error: 25

# ── Rule customization ────────────────────────────────────────────────────────
force_cast: warning           # not error — some AppKit bridging requires it
force_try: warning

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y
    - ax
    - fs

type_name:
  excluded:
    - ID

nesting:
  type_level: 2
  function_level: 3
